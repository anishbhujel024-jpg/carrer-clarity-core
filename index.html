<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Clarity Core Engine | Tactical Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Lexend:wght@100..900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FFC107;
      --tech-blue: #00e5ff;
      --bg-void: #000000;
      --bg-obsidian: #080808;
    }
    body { 
      font-family: 'Outfit', 'Lexend', sans-serif; 
      background-color: var(--bg-void);
      color: #F3F4F6;
      margin: 0;
      overflow-x: hidden;
    }
    .font-tech { font-family: 'Rajdhani', sans-serif; }
    
    /* Glitch Effect for Title */
    .glitch {
      position: relative;
      color: white;
    }
    .glitch::before, .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.8;
    }
    .glitch::before {
      left: 2px;
      text-shadow: -2px 0 #ff00c1;
      clip: rect(44px, 450px, 56px, 0);
      animation: glitch-anim 5s infinite linear alternate-reverse;
    }
    .glitch::after {
      left: -2px;
      text-shadow: -2px 0 #00fff9;
      clip: rect(44px, 450px, 56px, 0);
      animation: glitch-anim2 5s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim {
      0% { clip: rect(31px, 9999px, 94px, 0); }
      20% { clip: rect(62px, 9999px, 42px, 0); }
      40% { clip: rect(16px, 9999px, 78px, 0); }
      60% { clip: rect(89px, 9999px, 12px, 0); }
      80% { clip: rect(5px, 9999px, 54px, 0); }
      100% { clip: rect(31px, 9999px, 94px, 0); }
    }
    @keyframes glitch-anim2 {
      0% { clip: rect(65px, 9999px, 100px, 0); }
      20% { clip: rect(12px, 9999px, 58px, 0); }
      40% { clip: rect(95px, 9999px, 33px, 0); }
      60% { clip: rect(41px, 9999px, 88px, 0); }
      80% { clip: rect(22px, 9999px, 15px, 0); }
      100% { clip: rect(65px, 9999px, 100px, 0); }
    }

    /* Continuous Shimmer Effect for Button - Fixed Lagging endpoint */
    @keyframes persistent-shimmer {
      0% { transform: translateX(-200%) skewX(-25deg); }
      100% { transform: translateX(300%) skewX(-25deg); }
    }
    .shimmer-loop::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      animation: persistent-shimmer 2.5s infinite linear;
      pointer-events: none;
    }

    /* Custom Scrollbar for Terminal feel */
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #000;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #FFC107;
    }

    /* Salary Text Shine */
    .salary-text-shine {
      background: linear-gradient(90deg, #fff, #FFC107, #fff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 3s linear infinite;
    }
    @keyframes shine {
      to { background-position: 200% center; }
    }

    /* Tech Blue Glow for Alternative Jobs */
    .bg-tech-blue-glow {
      box-shadow: 0 0 50px -12px rgba(0, 229, 255, 0.1);
    }
    .border-tech-blue {
      border-color: rgba(0, 229, 255, 0.2);
    }
    .text-tech-blue {
      color: #00e5ff;
    }
  </style>
